# QuandoPassa: il bus urbano sulla mappa, stimato dall'orario GTFS (senza GPS a bordo).
#
#   cp .env.example .env
#   docker compose up --build                     app + server di inferenza (rules, offline) + server MCP
#   docker compose --profile llm up --build       + LLM locale con Ollama (modello piccolo, CPU)
#   docker compose --profile demo up --build -d   + istanza demo su :8001 (orologio fisso, per i video)
#   docker compose --profile test run --rm test   suite pytest
#   docker compose --profile backoffice up -d     + Postgres per il backoffice /admin (make backoffice lo configura)
#
# Il feed GTFS è la cartella indicata da GTFS_DIR nel .env, montata in sola lettura.
name: quandopassa

services:
  app:
    container_name: quandopassa-app
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      GTFS_DIR: /srv/gtfs
      INFERENCE_URL: http://inference:8080
    volumes:
      - ${GTFS_DIR:-./data}:/srv/gtfs:ro
      # backoffice: feed generato, impostazioni e logo (DATA_DIR=/srv/dati nel .env)
      - dati:/srv/dati
    depends_on:
      inference:
        condition: service_healthy
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # database del backoffice (profilo "backoffice"): fermate, linee, orari, avvisi, impostazioni, registro.
  # L'app pubblica legge i file GTFS generati: se il database si ferma, mappa e orari funzionano comunque.
  db:
    container_name: quandopassa-db
    image: postgres:17.6-alpine
    profiles: ["backoffice"]
    environment:
      POSTGRES_USER: quandopassa
      POSTGRES_DB: quandopassa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes: ["postgres:/var/lib/postgresql/data"]
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quandopassa -d quandopassa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # istanza demo (profilo "demo"): orologio fisso su un mercoledì mattina, quando circolano A e B.
  # Serve per video e presentazioni fuori dall'orario di servizio; l'app principale resta sull'ora reale.
  demo:
    container_name: quandopassa-demo
    build: .
    profiles: ["demo"]
    ports: ["8001:8000"]
    env_file: [.env]
    environment:
      GTFS_DIR: /srv/gtfs
      INFERENCE_URL: http://inference:8080
      DEMO_ORA: ${DEMO_ORA_ISTANZA_DEMO:-2026-11-11T09:00:00}
      # la demo non ha backoffice e non scrive nella cartella dati
      DATA_DIR: ""
      ADMIN_USER: ""
    volumes:
      - ${GTFS_DIR:-./data}:/srv/gtfs:ro
    depends_on:
      inference:
        condition: service_healthy

  inference:
    container_name: quandopassa-inference
    build: ./inference
    environment:
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-rules}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose: ["8080"]
    restart: unless-stopped

  # server MCP: il bus urbano come strumento per agenti esterni (usa solo le API HTTP dell'app)
  mcp:
    container_name: quandopassa-mcp
    build: ./mcp_server
    ports: ["127.0.0.1:8090:8090"]
    environment:
      QUANDOPASSA_URL: http://app:8000
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}
    depends_on: [app]
    restart: unless-stopped

  ollama:
    container_name: quandopassa-ollama
    image: ollama/ollama:0.12.11
    profiles: ["llm"]
    volumes: ["modelli:/root/.ollama"]
    expose: ["11434"]

  ollama-pull:
    container_name: quandopassa-ollama-pull
    image: ollama/ollama:0.12.11
    profiles: ["llm"]
    depends_on: [ollama]
    environment: { OLLAMA_HOST: "ollama:11434" }
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull ${LLM_MODEL:-qwen2.5:1.5b-instruct}"]
    restart: "no"

  test:
    container_name: quandopassa-test
    build:
      context: .
      dockerfile: tests.Dockerfile
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql://quandopassa:test@db-test:5432/quandopassa
    depends_on:
      db-test:
        condition: service_healthy

  # Postgres usa e getta per i test del backoffice
  db-test:
    container_name: quandopassa-db-test
    image: postgres:17.6-alpine
    profiles: ["test"]
    environment: { POSTGRES_USER: quandopassa, POSTGRES_DB: quandopassa, POSTGRES_PASSWORD: test }
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quandopassa -d quandopassa"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  modelli:
  dati:
  postgres:
